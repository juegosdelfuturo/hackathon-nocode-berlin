<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HackLab Robotics organizes premier robotics hackathons and competitions, connecting elite engineers with leading tech companies to solve real-world challenges." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="/hackathon1.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/hackathon2.webp" type="image/webp" fetchpriority="high" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  </noscript>
  <!-- Critical CSS inline to avoid render-blocking -->
  <style>
    :root{--bg:#09090b;--fg:#f4f4f5;--accent:#0066ff;--muted:#8e8e93;--border:#1e1e22;--card-bg:#121214;--font-sans:'Montserrat',sans-serif;--font-heading:'Cabinet Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background-color:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:var(--font-heading);font-weight:700;letter-spacing:-.03em;line-height:1.1}
    .platform-header{padding:0;border-bottom:1px solid var(--border);background:var(--bg);position:relative;z-index:500}
    .platform-header .nav-inner{padding:1rem 2rem;max-width:1100px;margin:0 auto}
    .nav-inner{display:flex;justify-content:space-between;align-items:center}
    .hacklab-logo-img{height:80px;width:auto;object-fit:contain;display:block}
    .hacklab-logo-link{text-decoration:none;display:flex;align-items:center;transition:transform .3s,opacity .3s}
    .platform-nav{display:flex;gap:.25rem;align-items:center}
    .platform-nav-link{background:none;border:none;color:var(--muted);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;cursor:pointer;padding:.5rem .85rem;border-radius:4px;transition:all .2s;position:relative}
    .platform-nav-link.active{color:var(--fg);background:rgba(0,102,255,.1)}
    .mobile-menu-btn{display:none;background:none;border:none;color:var(--fg);cursor:pointer;padding:.4rem}
    @media(max-width:768px){.mobile-menu-btn{display:flex}.platform-nav{display:none}}
    .brutal-wrapper{background:var(--bg);min-height:100vh}
    .brutal-hero-mixed{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 82px);border-bottom:1px solid var(--border)}
    .brutal-hero-content{padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border)}
    .brutal-huge-title{font-family:var(--font-heading);font-weight:900;font-size:clamp(2rem,5vw,4.5rem);line-height:1;letter-spacing:-.04em;text-transform:uppercase;color:var(--fg)}
    .brutal-accent-text{color:var(--accent)}
    .brutal-lead-text{font-size:.95rem;color:var(--muted);line-height:1.7;max-width:420px;margin-bottom:2rem}
    .brutal-primary-btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#fff;border:2px solid var(--accent);font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;padding:.85rem 1.5rem;font-weight:700;cursor:pointer;transition:all .25s;text-transform:uppercase}
    .brutal-hero-carousel{position:relative;overflow:hidden;background:var(--card-bg)}
    .brutal-image-wrapper{width:100%;height:100%;position:relative}
    .brutal-hero-img{width:100%;height:100%;object-fit:cover;display:block}
    .brutal-hero-bottom{display:flex;flex-direction:column;gap:1.5rem}
    .logo-brand{text-decoration:none;display:flex;align-items:center;gap:.5rem}
    @media(max-width:768px){.brutal-hero-mixed{grid-template-columns:1fr;min-height:auto}.brutal-hero-content{padding:2rem 1.25rem;border-right:none;border-bottom:1px solid var(--border)}.brutal-hero-carousel{height:220px}.brutal-huge-title{font-size:clamp(1.8rem,8vw,3rem)}}
  </style>
  <title>Hacklab Robotics</title>
</head>

<body>
  <div id="root">
    <!-- Pre-rendered skeleton: visible immediately, replaced by React on mount -->
    <header class="platform-header">
      <div class="nav-inner">
        <button class="logo-brand hacklab-logo-link" style="background:none;border:none;cursor:pointer;padding:0" aria-label="HackLab Home">
          <img src="/logos/hacklab.webp" alt="HackLab" class="hacklab-logo-img" width="160" height="80" fetchpriority="high" decoding="sync" />
        </button>
        <nav class="platform-nav">
          <button class="platform-nav-link active">HOME</button>
          <button class="platform-nav-link">OPPORTUNITIES</button>
        </nav>
        <button class="mobile-menu-btn" aria-label="Open navigation menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </header>
    <div class="brutal-wrapper">
      <section class="brutal-hero-mixed">
        <div class="brutal-hero-content">
          <h1 class="brutal-huge-title">THE BEST<br/><span class="brutal-accent-text">ROBOTICS COMPETITIONS</span><br/>FOR COMPANIES</h1>
          <div class="brutal-hero-bottom">
            <p class="brutal-lead-text">We organize high-impact robotics competitions where top engineers, designers, and innovators solve real-world challenges for leading tech companies. Join us to discover breakthrough solutions and elite talent.</p>
            <button class="brutal-primary-btn">JOIN THE COMMUNITY →</button>
          </div>
        </div>
        <div class="brutal-hero-carousel">
          <div class="brutal-image-wrapper">
            <img src="/hackathon1.webp" alt="Participants listening to keynote presentations" class="brutal-hero-img" width="771" height="285" fetchpriority="high" decoding="sync" />
          </div>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Google Analytics & Tag Manager deferred after page load -->
  <script>
    window.addEventListener('load', function() {
      // Google Analytics (gtag.js)
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-KZV36DKHYF';
      document.head.appendChild(gaScript);
      gaScript.onload = function() {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-KZV36DKHYF');
      };
      // Google Tag Manager
      (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
      new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
      'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
      })(window,document,'script','dataLayer','GTM-NB5QD5N6');
    });
  </script>
  <!-- GTM noscript fallback -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NB5QD5N6"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
</body>

</html>
